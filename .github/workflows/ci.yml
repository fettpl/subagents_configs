name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned developer requirements
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run isolated repository checks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ci_root="$(mktemp -d)"
          trap 'rm -rf "$ci_root"' EXIT
          mkdir -p "$ci_root/home" "$ci_root/codex" "$ci_root/opencode" "$ci_root/claude" "$ci_root/tmp"
          mkdir -p "$ci_root/pycache"
          mkdir -p "$ci_root/ruff-cache"
          chmod 700 "$ci_root" "$ci_root/home" "$ci_root/codex" "$ci_root/opencode" "$ci_root/claude" "$ci_root/tmp"
          chmod 700 "$ci_root/pycache"
          chmod 700 "$ci_root/ruff-cache"
          export HOME="$ci_root/home"
          export CODEX_HOME="$ci_root/codex"
          export OPENCODE_HOME="$ci_root/opencode"
          export CLAUDE_CONFIG_DIR="$ci_root/claude"
          export TMPDIR="$ci_root/tmp"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX="$ci_root/pycache"
          export RUFF_CACHE_DIR="$ci_root/ruff-cache"
          export VALIDATION_SMOKE_MODE=required

          bwrap=""
          sandbox_exec=""
          if test "${{ matrix.os }}" = "ubuntu-latest"; then
            for candidate in /usr/bin/bwrap /bin/bwrap; do
              if test -f "$candidate" && test -x "$candidate" && test "$(realpath "$candidate")" = "$candidate"; then
                bwrap="$candidate"
                break
              fi
            done
            if test -z "$bwrap"; then
              echo "no usable fixed bwrap; refusing an unsandboxed fallback"
              exit 1
            fi
            echo "trusted fixed bwrap: $bwrap"
          else
            if test -f /usr/bin/sandbox-exec && test -x /usr/bin/sandbox-exec && test "$(realpath /usr/bin/sandbox-exec)" = /usr/bin/sandbox-exec; then
              sandbox_exec=/usr/bin/sandbox-exec
            fi
            if test -z "$sandbox_exec"; then
              echo "no usable fixed sandbox-exec; refusing an unsandboxed fallback"
              exit 1
            fi
            echo "trusted fixed sandbox-exec: $sandbox_exec"
          fi
          shellcheck=""
          if test -f /usr/bin/shellcheck && test -x /usr/bin/shellcheck && test "$(realpath /usr/bin/shellcheck)" = /usr/bin/shellcheck; then
            shellcheck=/usr/bin/shellcheck
          fi
          if test -z "$shellcheck"; then
            echo "ShellCheck is unavailable; refusing to claim shell validation"
            exit 1
          fi

          python scripts/validate-catalogs.py
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m unittest tests.test_readme_contract tests.test_docs tests.test_ci -q
          python -m unittest tests.test_security_static -q
          python -m unittest tests.test_validation_backend.BackendIntegrationTests -v
          python -m unittest tests.test_validation_smoke -v
          ruff check subagents_configs scripts tests
          ruff format --check subagents_configs scripts tests
          sh -n ./*.sh
          "$shellcheck" install.sh uninstall.sh install-codex.sh uninstall-codex.sh install-opencode.sh uninstall-opencode.sh install-claude-code.sh uninstall-claude-code.sh
          python -m compileall -q subagents_configs scripts tests
          git diff --check
          if ! checkout_status="$(git status --short)"; then
            echo "Unable to determine checkout status; refusing to claim a clean checkout"
            exit 1
          fi
          if test -n "$checkout_status"; then
            echo "CI left checkout changes:"
            printf '%s\n' "$checkout_status"
            exit 1
          fi
