name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision private CI paths
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ci_root="$RUNNER_TEMP/subagents-configs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if test -e "$ci_root" || test -L "$ci_root"; then
            echo "private CI root already exists"
            exit 1
          fi
          mkdir -p "$ci_root/home" "$ci_root/xdg-cache" "$ci_root/xdg-config" "$ci_root/tmp" "$ci_root/pycache" "$ci_root/ruff-cache"
          chmod 700 "$ci_root" "$ci_root/home" "$ci_root/xdg-cache" "$ci_root/xdg-config" "$ci_root/tmp" "$ci_root/pycache" "$ci_root/ruff-cache"
          {
            echo "HOME=$ci_root/home"
            echo "XDG_CACHE_HOME=$ci_root/xdg-cache"
            echo "XDG_CONFIG_HOME=$ci_root/xdg-config"
            echo "TMPDIR=$ci_root/tmp"
            echo "PYTHONDONTWRITEBYTECODE=1"
            echo "PYTHONPYCACHEPREFIX=$ci_root/pycache"
            echo "RUFF_CACHE_DIR=$ci_root/ruff-cache"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provision Ubuntu bubblewrap
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap=0.9.0-1ubuntu0.1 apparmor=4.0.1really4.0.1-0ubuntu0.24.04.7 apparmor-profiles=4.0.1really4.0.1-0ubuntu0.24.04.7
          profile_source=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          parser=/usr/sbin/apparmor_parser
          if ! test -f "$profile_source" || ! test "$(realpath "$profile_source")" = "$profile_source" || ! test "$(stat -c '%u' "$profile_source")" = 0; then
            echo "AppArmor profile source is unavailable or unsafe"
            exit 1
          fi
          profile_mode="$(stat -c '%a' "$profile_source")"
          test "$((8#$profile_mode & 8#022))" -eq 0
          if ! test -f "$parser" || ! test -x "$parser" || ! test "$(realpath "$parser")" = "$parser" || ! test "$(stat -c '%u' "$parser")" = 0; then
            echo "AppArmor parser is unavailable or unsafe"
            exit 1
          fi
          parser_mode="$(stat -c '%a' "$parser")"
          test "$((8#$parser_mode & 8#022))" -eq 0
          sudo install --owner=root --group=root --mode=0644 "$profile_source" /etc/apparmor.d/bwrap-userns-restrict
          test -f /etc/apparmor.d/bwrap-userns-restrict
          test "$(realpath /etc/apparmor.d/bwrap-userns-restrict)" = /etc/apparmor.d/bwrap-userns-restrict
          test "$(stat -c '%u:%g' /etc/apparmor.d/bwrap-userns-restrict)" = 0:0
          test "$(stat -c '%a' /etc/apparmor.d/bwrap-userns-restrict)" = 644
          sudo /usr/sbin/apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
      - name: Bootstrap developer environment
        shell: bash
        run: |
          set -euo pipefail
          scripts/bootstrap-developer.sh
      - name: Verify Pi smoke is explicitly unavailable in ordinary CI
        shell: bash
        run: |
          set -euo pipefail
          PI_EXECUTABLE= .venv/bin/python -m unittest \
            tests.test_pi_smoke.PiSmokeTests.test_selector_reports_explicit_unavailable -v
      - name: Run isolated repository checks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ci_root="$(mktemp -d)"
          trap 'rm -rf "$ci_root"' EXIT
          mkdir -p "$ci_root/home" "$ci_root/codex" "$ci_root/opencode" "$ci_root/claude" "$ci_root/tmp"
          mkdir -p "$ci_root/pycache"
          mkdir -p "$ci_root/ruff-cache"
          chmod 700 "$ci_root" "$ci_root/home" "$ci_root/codex" "$ci_root/opencode" "$ci_root/claude" "$ci_root/tmp"
          chmod 700 "$ci_root/pycache"
          chmod 700 "$ci_root/ruff-cache"
          export HOME="$ci_root/home"
          export CODEX_HOME="$ci_root/codex"
          export OPENCODE_HOME="$ci_root/opencode"
          export CLAUDE_CONFIG_DIR="$ci_root/claude"
          export TMPDIR="$ci_root/tmp"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX="$ci_root/pycache"
          export RUFF_CACHE_DIR="$ci_root/ruff-cache"
          export VALIDATION_SMOKE_MODE=required
          if test "${{ matrix.os }}" = "ubuntu-24.04"; then
            export VALIDATION_SYSTEM_PYTHON=/usr/bin/python3.12
          else
            export VALIDATION_SYSTEM_PYTHON=/Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9/bin/python3.9
          fi

          bwrap=""
          sandbox_exec=""
          if test "${{ matrix.os }}" = "ubuntu-24.04"; then
            for candidate in /usr/bin/bwrap /bin/bwrap; do
              if test -f "$candidate" && test -x "$candidate" && test "$(realpath "$candidate")" = "$candidate" && test "$(stat -c '%u' "$candidate")" = 0; then
                tool_mode="$(stat -c '%a' "$candidate")"
                if test "$((8#$tool_mode & 8#022))" -eq 0; then
                  bwrap="$candidate"
                  break
                fi
              fi
            done
            if test -z "$bwrap"; then
              echo "no usable fixed bwrap; refusing an unsandboxed fallback"
              exit 1
            fi
            echo "trusted fixed bwrap: $bwrap"
          else
            if test -f /usr/bin/sandbox-exec && test -x /usr/bin/sandbox-exec && test "$(realpath /usr/bin/sandbox-exec)" = /usr/bin/sandbox-exec && test "$(stat -f '%u' /usr/bin/sandbox-exec)" = 0; then
              sandbox_mode="$(stat -f '%Lp' /usr/bin/sandbox-exec)"
              if test "$((8#$sandbox_mode & 8#022))" -eq 0; then
                sandbox_exec=/usr/bin/sandbox-exec
              fi
            fi
            if test -z "$sandbox_exec"; then
              echo "no usable fixed sandbox-exec; refusing an unsandboxed fallback"
              exit 1
            fi
            echo "trusted fixed sandbox-exec: $sandbox_exec"
          fi

          # The canonical validator owns this fixed discovery argv.
          # python -m unittest discover -s tests -p 'test_*.py'
          .venv/bin/python scripts/validate-repository.py
          .venv/bin/python -m unittest \
            tests.test_pi_catalog tests.test_pi_package \
            tests.test_pi_effective tests.test_pi_integration -v
          .venv/bin/python scripts/validate-catalogs.py
          .venv/bin/ruff check subagents_configs scripts tests
          .venv/bin/ruff format --check subagents_configs scripts tests
          .venv/bin/python -m compileall -q subagents_configs scripts tests
          if test "${{ matrix.os }}" = "ubuntu-24.04"; then
            shellcheck=""
            if test -f /usr/bin/shellcheck && test -x /usr/bin/shellcheck && test "$(realpath /usr/bin/shellcheck)" = /usr/bin/shellcheck && test "$(stat -c '%u' /usr/bin/shellcheck)" = 0; then
              shellcheck_mode="$(stat -c '%a' /usr/bin/shellcheck)"
              if test "$((8#$shellcheck_mode & 8#022))" -eq 0; then
                shellcheck=/usr/bin/shellcheck
              fi
            fi
            if test -z "$shellcheck"; then
              echo "ShellCheck is unavailable; refusing to claim shell validation"
              exit 1
            fi
            "$shellcheck" install.sh uninstall.sh install-codex.sh uninstall-codex.sh install-opencode.sh uninstall-opencode.sh install-claude-code.sh uninstall-claude-code.sh
          fi

  pi-release:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: [self-hosted, linux, x64, pi-release]
    permissions:
      contents: read
    env:
      PI_EXECUTABLE: ${{ vars.PI_EXECUTABLE }}
      PI_SMOKE_ROOT: ${{ vars.PI_SMOKE_ROOT }}
      PI_RELEASE_EVIDENCE_OUTPUT: ${{ vars.PI_RELEASE_EVIDENCE_OUTPUT }}
      PI_RELEASE_BACKEND: ${{ vars.PI_RELEASE_BACKEND }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require externally supplied exact Pi executable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PI_EXECUTABLE:-}"
          test -n "${PI_SMOKE_ROOT:-}"
          test -n "${PI_RELEASE_EVIDENCE_OUTPUT:-}"
          test -n "${PI_RELEASE_BACKEND:-}"
          case "$PI_EXECUTABLE" in
            /*) ;;
            *) echo "PI_EXECUTABLE must be an absolute path" >&2; exit 1 ;;
          esac
          test -f "$PI_EXECUTABLE"
          test -x "$PI_EXECUTABLE"
          test "$(realpath "$PI_EXECUTABLE")" = "$PI_EXECUTABLE"
          test "$(stat -c '%u:%h' "$PI_EXECUTABLE")" = "$(id -u):1"
          executable_mode="$(stat -c '%a' "$PI_EXECUTABLE")"
          test "$((8#$executable_mode & 8#022))" -eq 0
          case "$PI_SMOKE_ROOT" in
            /*) ;;
            *) echo "PI_SMOKE_ROOT must be an absolute path" >&2; exit 1 ;;
          esac
          test -d "$PI_SMOKE_ROOT"
          test "$(realpath "$PI_SMOKE_ROOT")" = "$PI_SMOKE_ROOT"
          test "$(stat -c '%u' "$PI_SMOKE_ROOT")" = "$(id -u)"
          smoke_root_mode="$(stat -c '%a' "$PI_SMOKE_ROOT")"
          test "$((8#$smoke_root_mode & 8#077))" -eq 0
          case "$PI_RELEASE_EVIDENCE_OUTPUT" in
            /*) ;;
            *) echo "PI_RELEASE_EVIDENCE_OUTPUT must be an absolute path" >&2; exit 1 ;;
          esac
          evidence_parent="$(dirname "$PI_RELEASE_EVIDENCE_OUTPUT")"
          test -d "$evidence_parent"
          test "$(realpath "$evidence_parent")" = "$evidence_parent"
          test "$(stat -c '%u' "$evidence_parent")" = "$(id -u)"
          evidence_parent_mode="$(stat -c '%a' "$evidence_parent")"
          test "$((8#$evidence_parent_mode & 8#077))" -eq 0
          case "$PI_RELEASE_BACKEND" in
            bubblewrap) ;;
            *) echo "PI_RELEASE_BACKEND must be the trusted bubblewrap backend" >&2; exit 1 ;;
          esac
      - name: Bootstrap release test environment
        shell: bash
        run: |
          set -euo pipefail
          scripts/bootstrap-developer.sh
      - name: Run mandatory exact Pi 0.84.1 release smoke
        shell: bash
        run: |
          set -euo pipefail
          PI_EXECUTABLE="$PI_EXECUTABLE" .venv/bin/python scripts/run-pi-release-smoke.py
          PI_EXECUTABLE="$PI_EXECUTABLE" .venv/bin/python -m unittest tests.test_pi_smoke.PiReleaseSmokeTests -v
